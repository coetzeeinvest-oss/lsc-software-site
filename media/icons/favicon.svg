<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LiftMe HQ">
  <defs>
    <linearGradient id="hqLogoAmberFill" x1="20" y1="10" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7C463"/>
      <stop offset=".55" stop-color="#FBB02D"/>
      <stop offset="1" stop-color="#E09B1C"/>
    </linearGradient>
    <clipPath id="hqLogoCircleClip"><circle cx="100" cy="100" r="100"/></clipPath>
    <pattern id="hqLogoTread" width="17" height="60" patternUnits="userSpaceOnUse">
      <rect width="17" height="60" fill="#03045E"/>
      <rect x="12.5" width="4.5" height="60" fill="#FBB02D"/>
    </pattern>
    <linearGradient id="hqLogoSkidFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".16" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hqLogoSkidMask">
      <rect x="-70" y="70" width="340" height="60" fill="url(#hqLogoSkidFade)"/>
    </mask>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#hqLogoAmberFill)"/>
  <g clip-path="url(#hqLogoCircleClip)">
    <g mask="url(#hqLogoSkidMask)">
      <g transform="rotate(-26 100 100)">
        <rect x="-70" y="70" width="340" height="60" fill="url(#hqLogoTread)"/>
      </g>
    </g>
  </g>
</svg>
