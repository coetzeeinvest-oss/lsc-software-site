<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>LiftMe Facebook cover (1920x1080)</title>
<!--
  Facebook Page cover for LiftMe by LSC Software.
  Canvas is 16:9 (1920x1080): Facebook shows the full 16:9 on mobile and crops a
  centred ~2.6:1 strip on desktop, so everything important sits inside the
  "safe zone" described below.

  SAFE ZONE (px on the 1920x1080 canvas)
    - Left half (x < 950): on mobile the profile photo is drawn as a huge circle
      (centre ~(470, 850), radius ~430 in the upload preview) -> decoration only
    - All text lives in the right half: x 980 - 1760
    - Top 0-190:       phone status bar + desktop crop  -> nothing important
    - Bottom 900-1080: desktop crop                     -> nothing important
    - Top-right (x > 1500, y 280-410): search / edit buttons on mobile ->
      keep text narrower than x 1480 in that band
    - Bottom-right (x > 1700, y > 850): camera button for page admins -> empty

  Render:  1920x1080 screenshot -> media/social/liftme-facebook-cover.png
-->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #020447;
    --navy-700: #03045E;
    --navy-600: #032B7A;
    --blue: #023EBA;
    --blue-soft: #4C74D6;
    --amber: #FBB02D;
    --amber-mid: #F7C463;
    --ice: #CFE0FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: var(--navy-700); }
  body { font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background:
      radial-gradient(900px 700px at 88% 4%, rgba(76, 116, 214, .5), rgba(76, 116, 214, 0) 70%),
      radial-gradient(1000px 800px at 6% 108%, rgba(2, 62, 186, .55), rgba(2, 62, 186, 0) 70%),
      linear-gradient(135deg, #03045E 0%, #032B7A 52%, #023EBA 100%);
  }

  /* ---------- text block (right half) ---------- */
  .copy { position: absolute; left: 980px; top: 228px; width: 800px; }

  .eyebrow {
    display: inline-block;
    padding: 11px 26px;
    border: 2px solid rgba(251, 176, 45, .9);
    border-radius: 999px;
    color: var(--amber);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: rgba(3, 4, 94, .35);
  }

  .product {
    display: block;
    margin-top: 22px;
    margin-left: -6px;               /* optical alignment of the L with the text edge */
    font-family: 'Outfit', 'Figtree', sans-serif;
    font-weight: 600;
    font-size: 150px;
    line-height: .92;
    font-kerning: none;
    letter-spacing: 0.01em;
    color: #fff;
  }
  .maker {
    display: block;
    margin-top: 8px;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: .005em;
    color: var(--amber);
  }

  .tagline {
    margin-top: 26px;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.38;
    color: var(--ice);
  }

  /* ---------- feature pills ---------- */
  .features {
    margin-top: 40px;
    display: flex; flex-wrap: wrap; gap: 16px;
  }
  .pill {
    display: flex; align-items: center; gap: 14px;
    height: 68px;
    padding: 0 30px 0 14px;
    border-radius: 999px;
    background: #fff;
    color: var(--navy-700);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -.005em;
    box-shadow: 0 10px 28px rgba(2, 4, 71, .35);
  }
  .pill .ico {
    flex: none;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--amber);
    display: grid; place-items: center;
  }
  .pill svg { width: 23px; height: 23px; fill: none; stroke: var(--navy-700); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- route decoration (left, top) ---------- */
  .route { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div class="stage">
  <svg class="route" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <!-- dotted route: leaves the "school" dot, arcs over the top and drops onto the pin -->
    <path d="M250 330 C360 215 600 180 740 255 C805 290 850 316 856 350"
          fill="none" stroke="#FBB02D" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 17" opacity=".95"/>
    <circle cx="250" cy="330" r="14" fill="#fff"/>
    <circle cx="250" cy="330" r="26" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <circle cx="484" cy="221" r="11" fill="#FBB02D"/>
    <!-- destination pin -->
    <circle cx="856" cy="392" r="38" fill="#FBB02D" opacity=".28" filter="url(#glow)"/>
    <path d="M856 442 C856 442 826 410 826 382 a30 30 0 0 1 60 0 c0 28 -30 60 -30 60z" fill="#FBB02D"/>
    <circle cx="856" cy="382" r="11" fill="#03045E"/>
  </svg>

  <div class="copy">
    <div class="eyebrow">Scholar Transport Platform</div>
    <span class="product">LiftMe</span>
    <span class="maker">by LSC Software</span>
    <div class="tagline">Dispatch, live tracking and billing<br>built for South African scholar transport.</div>

    <div class="features">
      <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Scheduling &amp; dispatch</div>
      <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>Live GPS tracking</div>
      <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg></span>Parent portal</div>
      <div class="pill"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>Invoicing</div>
    </div>
  </div>
</div>
</body>
</html>
